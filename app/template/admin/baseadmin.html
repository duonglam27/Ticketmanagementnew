<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Admin Panel{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/4c07be8c60.js" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            color: white;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #334155;
            color: white;
        }

        .sidebar .active {
            background: #22c55e;
            color: white;
        }

        .main-content {
            margin-left: 240px;
            padding: 20px;
        }

        .topbar {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
        }
    </style>

    {% block css %}{% endblock %}
</head>

<body>

<!-- 🔥 SIDEBAR -->
<div class="sidebar">
    <h4 class="text-center py-3 border-bottom">ADMIN</h4>

    <a href="{{ url_for('admin.admin_dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('admin.manage_events') }}">
        Quản lý sự kiện
    </a>

    <a href="{{ url_for('admin.manage_users') }}">
        Người dùng
    </a>

    <a href="{{ url_for('admin.revenue') }}">
        Doanh thu
    </a>

    <a href="{{ url_for('admin.manage_tickets') }}">
        Vé & Check-in
    </a>

    <a href="{{ url_for('user_logout') }}">
        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
    </a>
</div>

<!-- 🔥 MAIN -->
<div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h5>
        </div>

        <div>
            <span class="me-3 text-secondary">
                <i class="fas fa-user-circle me-1"></i>
                {{ current_user.name }}
            </span>
        </div>
    </div>

    <!-- CONTENT -->
    {% block content %}{% endblock %}

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% block script %}{% endblock %}

</body>
</html>
