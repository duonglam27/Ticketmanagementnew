{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}

<div class="container" style="max-width: 450px;">
    <h2 class="text-center text-danger mt-4 mb-4">ĐĂNG NHẬP</h2>

{% if err_msg %}
    <div class="alert alert-danger">{{ err_msg }}</div>
{% endif %}

<form method="post">

    <!-- EMAIL -->
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email"
               name="email" placeholder="Email"
               value="{{ request.form.get('email', '') }}" required autofocus>
        <label for="email">Email</label>
    </div>

    <!-- PASSWORD -->
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password"
               name="password" placeholder="Mật khẩu" required>
        <label for="password">Mật khẩu</label>
    </div>

    <!-- SUBMIT -->
    <button type="submit" class="btn btn-success w-100 mb-3">
        Đăng nhập
    </button>

    <!-- REGISTER -->
    <div class="text-center mb-2">
        <p>Chưa có tài khoản? <a href="{{ url_for('user_register') }}">Đăng ký ngay</a></p>
    </div>

    <!-- OAUTH -->
    <div class="text-center">
        <div class="mb-2">Hoặc đăng nhập bằng:</div>
        <a href="/oauth" class="btn btn-secondary w-100">Google</a>
    </div>

</form>


</div>
{% endblock %}
