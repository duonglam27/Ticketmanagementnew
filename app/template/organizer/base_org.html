<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Organizer Center{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar { width: 260px; min-height: 100vh; background: #1a1a1a; }
        .nav-link { color: #aaa; padding: 15px 20px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: #fff; background: #28a745; }
    </style>
</head>
<body class="bg-black">

<div class="d-flex">
    <div class="sidebar border-end border-secondary">
        <div class="p-4 text-success fw-bold fs-5">
            <i class="fas fa-bolt me-2"></i>Organizer Center
        </div>
        <nav class="nav flex-column">
    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('organizer_dashboard') }}">
        <i class="fas fa-chart-line me-2"></i> Dashboard
    </a>

    <a class="nav-link {% if active_page == 'events' %}active{% endif %}" href="{{ url_for('organizer_events') }}">
        <i class="fas fa-calendar-alt me-2"></i> Sự kiện của tôi
    </a>

    <a class="nav-link" href="#">
        <i class="fas fa-chart-bar me-2"></i> Báo cáo
    </a>

    <a class="nav-link" href="#">
        <i class="fas fa-file-alt me-2"></i> Điều khoản
    </a>
</nav>
    </div>

    <div class="flex-grow-1">
        <div class="d-flex justify-content-end p-3 border-bottom border-secondary bg-dark">
            <a href="{{ url_for('event_create') }}" class="btn btn-success rounded-pill px-4">
                <i class="fas fa-plus me-2"></i>Tạo sự kiện
            </a>
        </div>

        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
