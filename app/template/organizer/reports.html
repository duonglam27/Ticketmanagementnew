{% extends 'organizer/base_org.html' %}
{% block content %}
<div class="container-fluid p-4">
    <div class="card bg-dark border-secondary p-4 mt-4">
        <h5 class="text-light mb-3">Xu hướng doanh thu (VNĐ)</h5>
        <div style="height: 300px;"><canvas id="revenueChart"></canvas></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartData = {{ data.chart | tojson }};
    if (chartData.length > 0) {
        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: chartData.map(item => item.date),
                datasets: [{
                    label: 'Doanh thu theo ngày',
                    data: chartData.map(item => item.revenue),
                    borderColor: '#198754',
                    backgroundColor: 'rgba(25, 135, 84, 0.1)',
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
</script>
{% endblock %}
